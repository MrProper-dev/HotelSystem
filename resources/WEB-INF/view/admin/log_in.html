<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отель · Вход в аккаунт</title>
    <link rel="stylesheet" href="/hotelsystem/css/admin/log_in.css">
    <script src="/hotelsystem/js/admin/log_in.js" defer></script>
</head>
<body>
    <div class="app-container">

        <div class="page-header">
            <div class="page-title">Вход в аккаунт</div>
        </div>

        <div class="login-container">
            <div class="form-title">Добро пожаловать</div>

            <!-- Форма входа -->
            <form method="POST" action="/hotelsystem/admin/login" id="loginForm">
                <div class="form-fields">
                    <!-- Логин -->
                    <div class="field-group">
                        <div class="field-label">Логин</div>
                        <div class="field-input">
                            <input type="text" name="login" placeholder="login" required>
                        </div>
                    </div>

                    <!-- Пароль -->
                    <div class="field-group">
                        <div class="field-label">Пароль</div>
                        <div class="field-input">
                            <input type="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <!-- Кнопка входа -->
                <div class="action-buttons">
                    <button type="submit" class="button primary">Войти</button>
                </div>
            </form>
        </div>

        <!-- модальное окно (info) -->
        <dialog id="infoModal" class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <p id="infoModalText">Сообщение по умолчанию.</p>
                </div>
                <div class="modal-footer">
                    <button id="infoModalOk" class="button-primary">ОК</button>
                </div>
            </div>
        </dialog>

        <div class="footer-placeholder">
            HavenStay — система управления номерным фондом
        </div>
    </div>
</body>
</html>
