<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отель · Вход в аккаунт</title>
    <link rel="stylesheet" href="/hotelsystem/css/client/log_in.css">
    <script src="/hotelsystem/js/client/log_in.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Верхняя навигация -->
        <div class="top-nav">
            <div class="logo-block">
                <a href="/hotelsystem/rooms" class="logo-placeholder" style="text-decoration: none;">
                    <span class="logo-icon">🏡</span>
                    <span class="logo-text">HavenStay<span class="logo-accent">hotel</span></span>
                </a>
                <div class="nav-links">
                    <a href="/hotelsystem/rooms" class="nav-link">Комнаты</a>
                    <a href="#" class="nav-link">Мои брони</a>
                    <a href="#" class="nav-link">Профиль</a>
                </div>
            </div>
        </div>

        <div class="page-header">
            <div class="page-title">🔐 Вход в аккаунт</div>
        </div>

        <div class="login-container">
            <div class="form-title">Добро пожаловать</div>

            <!-- Форма входа -->
            <form method="POST" action="" id="loginForm">
                <div class="form-fields">
                    <!-- Электронная почта (логин) -->
                    <div class="field-group">
                        <div class="field-label">Электронная почта</div>
                        <div class="field-input">
                            <input type="email" name="email" placeholder="user@example.com" required>
                        </div>
                    </div>

                    <!-- Пароль -->
                    <div class="field-group">
                        <div class="field-label">Пароль</div>
                        <div class="field-input">
                            <input type="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <!-- Кнопка входа -->
                <div class="action-buttons">
                    <button type="submit" class="button primary">Войти</button>
                </div>
            </form>

            <!-- Ссылка на регистрацию -->
            <div class="register-link">
                <a href="/hotelsystem/singup">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </div>

        <!-- модальное окно (info) -->
        <dialog id="infoModal" class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <p id="infoModalText">Сообщение по умолчанию.</p>
                </div>
                <div class="modal-footer">
                    <button id="infoModalOk" class="button-primary">ОК</button>
                </div>
            </div>
        </dialog>

        <div class="footer-placeholder">
            🌿 HavenStay — тишина, комфорт и забота о каждом госте
        </div>
    </div>

    <script>
        
    </script>
</body>
</html>
